esphome:
  name: reterminal-e1002-all-peripherals
  friendly_name: "reTerminal E1002 All Peripherals"
  on_boot:
    priority: 600
    then:
      - output.turn_on: bsp_sd_enable
      - output.turn_on: bsp_battery_enable
      - output.turn_on: bsp_mic_enable
      - delay: 100ms
      - component.update: battery_voltage
      - component.update: battery_level

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:
  hardware_uart: UART0
  level: INFO

api:
  encryption:
    key: !secret ha_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "reTerminal-E1002-Setup"
    password: "ChangeMe123"

captive_portal:

# Bus SPI para Pantalla y MicroSD
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

# Bus I2C para SHT40 y PCF8563 RTC
i2c:
  scl: GPIO20
  sda: GPIO19

# Reloj de tiempo real por hardware (mantiene la hora sin internet si hay pila CR1220)
time:
  - platform: pcf8563
    id: hw_rtc
    address: 0x51
    update_interval: 60s

font:
  - file: "gfonts://Inter@700"
    id: font_title
    size: 28
  - file: "gfonts://Inter@700"
    id: font_data
    size: 22

sensor:
  # Sensor SHT40
  - platform: sht4x
    temperature:
      name: "Temperatura SHT40"
      id: temp_sensor
    humidity:
      name: "Humedad SHT40"
      id: hum_sensor

  # Medición analógica de batería
  - platform: adc
    pin: GPIO1
    name: "Voltaje Bateria"
    id: battery_voltage
    update_interval: 60s
    attenuation: 12db
    filters:
      - multiply: 2.0

  - platform: template
    name: "Nivel Bateria"
    id: battery_level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    lambda: 'return id(battery_voltage).state;'
    update_interval: 60s
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

output:
  - platform: gpio
    pin: GPIO6
    id: bsp_led
    inverted: true

  - platform: gpio
    pin: GPIO16
    id: bsp_sd_enable

  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

  - platform: gpio
    pin: GPIO38
    id: bsp_mic_enable

  - platform: ledc
    pin: GPIO45
    id: buzzer_pwm

light:
  - platform: binary
    name: "LED de Estado"
    output: bsp_led
    id: onboard_led

  - platform: monochromatic
    name: "Zumbador"
    output: buzzer_pwm
    id: buzzer_tone

binary_sensor:
  # Detección física de tarjeta MicroSD
  - platform: gpio
    pin:
      number: GPIO15
      mode: INPUT_PULLUP
      inverted: true
    name: "MicroSD Presente"
    id: sd_detect

  # Botón verde (KEY0 / GPIO3)
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    id: key0
    name: "Boton Verde (KEY0)"
    on_press:
      then:
        - light.turn_on:
            id: buzzer_tone
            brightness: 40%
        - delay: 40ms
        - light.turn_off: buzzer_tone
        - component.update: epaper_display

  # Botón izquierdo (KEY1 / GPIO4)
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    id: key1
    name: "Boton Izquierdo (KEY1)"

  # Botón derecho (KEY2 / GPIO5)
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: key2
    name: "Boton Derecho (KEY2)"

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: 180s
    lambda: |-
      const auto BLACK   = Color(0,   0,   0,   0);
      const auto RED     = Color(255, 0,   0,   0);
      const auto GREEN   = Color(0,   255, 0,   0);
      const auto BLUE    = Color(0,   0,   255, 0);
      const auto YELLOW  = Color(255, 255, 0,   0);
      const auto WHITE   = Color(255, 255, 255, 0);

      it.fill(WHITE);

      it.filled_rectangle(0, 0, 800, 50, BLUE);
      it.printf(400, 25, id(font_title), WHITE, TextAlign::CENTER, "Diagnostico de Hardware reTerminal E1002");

      int y = 90;
      auto now = id(hw_rtc).now();
      it.printf(40, y, id(font_data), BLACK, "RTC Hardware (PCF8563): %02d/%02d/%04d %02d:%02d:%02d", now.day_of_month, now.month, now.year, now.hour, now.minute, now.second);

      y += 50;
      it.printf(40, y, id(font_data), RED, "Sensor SHT40 Temp: %.1f C | Humedad: %.1f %%", id(temp_sensor).state, id(hum_sensor).state);

      y += 50;
      it.printf(40, y, id(font_data), GREEN, "Bateria: %.2f V  (%.0f %%)", id(battery_voltage).state, id(battery_level).state);

      y += 50;
      bool sd_ok = id(sd_detect).state;
      it.printf(40, y, id(font_data), sd_ok ? GREEN : RED, "Ranura MicroSD (GPIO15): %s", sd_ok ? "TARJETA DETECTADA" : "SIN TARJETA");

      y += 50;
      it.printf(40, y, id(font_data), BLUE, "Microfono PDM: Encendido (PWR: GPIO38, CLK: GPIO42, DAT: GPIO41)");

      y += 50;
      it.printf(40, y, id(font_data), YELLOW, "Zumbador (GPIO45) y LED (GPIO6): Operativos");

      it.rectangle(20, 60, 760, 390, BLACK);
