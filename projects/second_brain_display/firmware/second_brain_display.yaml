esphome:
  name: reterminal-second-brain
  friendly_name: "Second Brain E1002"
  includes:
    - schedule.h
  on_boot:
    priority: 600
    then:
      - output.turn_on: bsp_battery_enable
      # Un despertar programado de noche no muestra nada: se vuelve a dormir apenas tiene la hora.
      - lambda: |-
          if (esp_sleep_get_wakeup_cause() != ESP_SLEEP_WAKEUP_TIMER)
            id(awake_until_ms) = millis() + AWAKE_GRACE_MS;
      - delay: 200ms
      - component.update: battery_voltage

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 80MHZ # Basta para descargar y decodificar el PNG; 240 MHz consumía de más todo el día
  framework:
    type: arduino

# Habilitar 8MB PSRAM Octal para buffers gráficos
psram:
  mode: octal

logger:
  hardware_uart: UART0
  level: INFO

api:
  reboot_timeout: 0s # Evita reinicios automáticos cada 15 min cuando no hay Home Assistant conectado

ota:
  platform: esphome

wifi:
  # Mayor prioridad se intenta primero; si falla, ESPHome baja su prioridad y prueba la de respaldo.
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 1
    - ssid: !secret wifi_fallback_ssid
      password: !secret wifi_fallback_password
      priority: 0
  reboot_timeout: 0s # Evita reinicios por micro-desconexiones Wi-Fi
  # LIGHT (el default de ESPHome en ESP32): con NONE la radio no dormía nunca y la batería duraba ~19 h.
  power_save_mode: LIGHT
  ap:
    ssid: "reTerminal-SecondBrain-AP"
    password: "ChangeMe123"
  on_connect:
    then:
      - delay: 1s
      - logger.log: "Wi-Fi conectado."
      - if:
          condition:
            lambda: 'return !id(boot_synced);'
          then:
            - lambda: |-
                id(boot_synced) = true;
                auto cause = esp_sleep_get_wakeup_cause();
                bool fetch = true;
                // Tras un deep sleep la hora sigue válida (la lleva el RTC); en un arranque en frío no.
                auto now = id(sntp_time).now();
                if (now.is_valid()) {
                  bool work = is_work_hours(now.day_of_week, now.hour, now.minute);
                  if (cause == ESP_SLEEP_WAKEUP_TIMER) {
                    // De noche la tinta ya muestra lo último: solo se dibuja al empezar la jornada.
                    if (work) id(display_mode) = 0; else fetch = false;
                  } else if (cause != ESP_SLEEP_WAKEUP_EXT1) {
                    id(display_mode) = work ? 0 : 1;  // arranque en frío: manda el horario
                  }  // despertado por un botón: se respeta el modo elegido
                  id(initial_time_synced) = true;
                  ESP_LOGI("schedule", "Arranque (causa %d, %s): Modo %s%s", (int) cause,
                           (work ? "Horario laboral" : "Noche/Fin de semana"),
                           (id(display_mode) == 0 ? "PENDIENTES" : "GALERIA"), (fetch ? "" : ", sin redibujar"));
                }
                if (fetch) id(fetch_view).execute();

captive_portal:

# Cliente HTTP para descargar vistas desde la Raspberry Pi
http_request:
  id: http_client
  timeout: 10s

# Bus SPI de la pantalla ePaper
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

# Bus I2C para sensor SHT40
i2c:
  scl: GPIO20
  sda: GPIO19

globals:
  - id: boot_synced
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: initial_time_synced
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: view_index
    type: int
    restore_value: true
    initial_value: '0'

  # Modo de visualización: 0 = Pendientes Simpli, 1 = Galería de Imágenes
  # restore_value: true garantiza que se quede en Galería indefinidamente hasta presionar los 2 botones
  - id: display_mode
    type: int
    restore_value: true
    initial_value: '0'

  # Sin tope en el dispositivo: el backend lo envuelve con idx % total (incluye negativos),
  # así la galería puede crecer sin reflashear.
  - id: gallery_index
    type: int
    restore_value: true
    initial_value: '0'

  - id: combo_active
    type: bool
    restore_value: false
    initial_value: 'false'

  # Lo pone el refresco de 15 min: pide la imagen con if_changed=1 y el backend responde 304 si no cambió nada.
  - id: only_if_changed
    type: bool
    restore_value: false
    initial_value: 'false'

  # true solo si la última descarga se dibujó bien. El backend anota el estado al enviar el 200; si la
  # descarga falla aquí, sin esto respondería 304 a una pantalla desactualizada hasta el próximo cambio.
  - id: screen_synced
    type: bool
    restore_value: false
    initial_value: 'false'

  # Fuera de horario no se duerme antes de este millis(): lo extienden el arranque y cada fetch_view.
  - id: awake_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # La hora del RTC tras un deep sleep viene desviada: se espera el SNTP para calcular el próximo despertar.
  - id: sntp_synced
    type: bool
    restore_value: false
    initial_value: 'false'

sensor:
  - platform: sht4x
    temperature:
      name: "Temperatura Ambiente"
      id: room_temp
    humidity:
      name: "Humedad Ambiente"
      id: room_hum

  - platform: adc
    pin: GPIO1
    name: "Voltaje Batería"
    id: battery_voltage
    update_interval: 60s
    attenuation: 12db
    filters:
      - multiply: 2.0

output:
  - platform: gpio
    pin: GPIO6
    id: bsp_led
    inverted: true

  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

  - platform: ledc
    pin: GPIO45
    id: buzzer_pwm

light:
  - platform: binary
    name: "LED Frontal"
    output: bsp_led
    id: status_led

  - platform: monochromatic
    name: "Zumbador"
    output: buzzer_pwm
    id: buzzer_tone

# Descarga de imagen dinámica desde el backend de la Raspberry Pi
image:
  - platform: online_image
    id: sb_view_image
    url: "http://192.168.4.36:8088/render?view=resumen"
    format: PNG
    type: RGB565
    buffer_size: 65536
    update_interval: never # Se actualiza mediante el script fetch_view
    on_download_finished:
      then:
        - if:
            condition:
              lambda: 'return !cached;'
            then:
              - light.turn_on:
                  id: status_led
              - delay: 200ms
              - light.turn_off:
                  id: status_led
              - component.update: epaper_display
              - lambda: 'id(screen_synced) = true;'
            else:
              - logger.log: "Sin cambios en pendientes (HTTP 304): no se refresca la pantalla"
    on_error:
      then:
        - lambda: 'id(screen_synced) = false;'
        - logger.log: "Error descargando imagen desde el backend"

script:
  - id: toggle_display_mode
    then:
      - lambda: |-
          id(combo_active) = true;
          id(display_mode) = (id(display_mode) == 0) ? 1 : 0;
          ESP_LOGI("mode", "Cambiando modo a: %s", (id(display_mode) == 0 ? "PENDIENTES" : "GALERIA"));
      # Doble tono confirmatorio de cambio de modo
      - light.turn_on:
          id: buzzer_tone
          brightness: 40%
      - delay: 60ms
      - light.turn_off:
          id: buzzer_tone
      - delay: 60ms
      - light.turn_on:
          id: buzzer_tone
          brightness: 60%
      - delay: 100ms
      - light.turn_off:
          id: buzzer_tone
      - script.execute: fetch_view

  - id: fetch_view
    then:
      - lambda: |-
          id(awake_until_ms) = millis() + AWAKE_GRACE_MS;  // que no se duerma a mitad del refresco
          std::string url;
          if (id(display_mode) == 0) {
            // Modo Pendientes Simpli
            const char* views[] = {"resumen", "alta", "media", "baja", "clientes"};
            url = std::string("http://192.168.4.36:8088/render?view=") + views[id(view_index)];
            if (id(only_if_changed) && id(screen_synced)) {
              url += "&if_changed=1";
            }
          } else {
            // Modo Galería de Imágenes (Árbol genealógico Cien años de soledad)
            url = std::string("http://192.168.4.36:8088/render?mode=galeria&idx=") + esphome::to_string(id(gallery_index));
          }
          // IP propia del reTerminal: detrás de un router con NAT el backend solo ve la del router, y el OTA necesita esta.
          char ip_buf[network::IP_ADDRESS_BUFFER_SIZE];
          url += std::string("&ip=") + wifi::global_wifi_component->get_ip_addresses()[0].str_to(ip_buf);
          if (!isnan(id(battery_voltage).state)) {
            url += "&vbat=" + esphome::to_string(id(battery_voltage).state);
          }
          if (!isnan(id(room_temp).state)) {
            url += "&temp=" + esphome::to_string(id(room_temp).state);
          }
          if (!isnan(id(room_hum).state)) {
            url += "&hum=" + esphome::to_string(id(room_hum).state);
          }
          id(only_if_changed) = false;
          ESP_LOGI("second_brain", "Solicitando imagen (%s): %s",
                   (id(display_mode) == 0 ? "Pendientes" : "Galería"), url.c_str());
          id(sb_view_image).set_url(url);
          id(sb_view_image).update();

# Sincronización horaria SNTP (Zona horaria Chile)
time:
  - platform: sntp
    id: sntp_time
    timezone: "America/Santiago"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        - lambda: 'id(sntp_synced) = true;'
        - if:
            condition:
              lambda: 'return !id(initial_time_synced);'
            then:
              - lambda: |-
                  id(initial_time_synced) = true;
                  auto now = id(sntp_time).now();
                  if (now.is_valid()) {
                    bool work = is_work_hours(now.day_of_week, now.hour, now.minute);
                    int target_mode = work ? 0 : 1;
                    if (id(display_mode) != target_mode) {
                      ESP_LOGI("schedule", "Sincronización horaria inicial: ajustando a Modo %s (%s)",
                               (target_mode == 0 ? "PENDIENTES" : "GALERIA"),
                               (work ? "Horario laboral" : "Noche/Fin de semana"));
                      id(display_mode) = target_mode;
                      id(fetch_view).execute();
                    }
                  }
    on_time:
      # 1) A las 08:45 de Lunes a Viernes: Inicio de jornada laboral -> Activar automáticamente Modo Pendientes
      - seconds: 0
        minutes: 45
        hours: 8
        days_of_week: MON-FRI
        then:
          - logger.log: "Inicio de jornada laboral (08:45 Lun-Vie): activando Modo Pendientes"
          - lambda: |-
              id(display_mode) = 0;
          - script.execute: fetch_view

      # 2) Cada 15 minutos entre 09:00 y 18:45 de Lunes a Viernes (refresco periódico solo en Modo Pendientes)
      - seconds: 0
        minutes: /15
        hours: 9-18
        days_of_week: MON-FRI
        then:
          - if:
              condition:
                lambda: 'return id(display_mode) == 0;'
              then:
                - logger.log: "Refresco programado (09:00-18:45 Lun-Vie cada 15 min, solo si hay cambios)"
                - lambda: 'id(only_if_changed) = true;'
                - script.execute: fetch_view

      # 3) A las 19:00 todos los días: Cierre de jornada / Noche / Fin de semana -> Activar automáticamente Modo Galería
      - seconds: 0
        minutes: 0
        hours: 19
        then:
          - if:
              condition:
                lambda: 'return id(display_mode) == 0;'
              then:
                - logger.log: "Cierre diario (19:00): activando Modo Galería para la noche / fin de semana"
                - lambda: |-
                    id(display_mode) = 1;
                - script.execute: fetch_view

# Deep sleep fuera de horario laboral. Despierta a las 08:45 del próximo día hábil (por tramos de 4 h)
# o con cualquier botón: los tres son activos en bajo con pull-up externo de 10K (R30/R34/R36).
deep_sleep:
  id: deep_sleep_ctl
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - pin: # Verde: despierta y redibuja la vista actual
          number: GPIO3
          allow_other_uses: true
      - pin: # Derecho: despierta y avanza, como su on_press
          number: GPIO4
          allow_other_uses: true
        on_wake:
          - lambda: |-
              if (id(display_mode) == 0) id(view_index) = (id(view_index) + 1) % 5;
              else id(gallery_index) += 1;
      - pin: # Izquierdo: despierta y retrocede
          number: GPIO5
          allow_other_uses: true
        on_wake:
          - lambda: |-
              if (id(display_mode) == 0) id(view_index) = (id(view_index) - 1 + 5) % 5;
              else id(gallery_index) -= 1;

interval:
  - interval: 30s
    then:
      - if:
          condition:
            lambda: |-
              auto now = id(sntp_time).now();
              if (!now.is_valid() || is_work_hours(now.day_of_week, now.hour, now.minute)) return false;
              if (millis() < id(awake_until_ms)) return false;  // arranque, botón o refresco recientes
              return id(sntp_synced) || millis() > 120000;     // sin SNTP en 2 min, se usa la hora del RTC
          then:
            - lambda: |-
                auto now = id(sntp_time).now();
                ESP_LOGI("schedule", "Fuera de horario: deep sleep por %u min",
                         ms_until_workday(now.day_of_week, now.hour, now.minute, now.second, SLEEP_CHUNK_MS) / 60000);
            - deep_sleep.enter:
                id: deep_sleep_ctl
                sleep_duration: !lambda |-
                  auto now = id(sntp_time).now();
                  return ms_until_workday(now.day_of_week, now.hour, now.minute, now.second, SLEEP_CHUNK_MS);

# Pantalla E Ink Spectra 6 (800x480)
display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never # Solo se refresca cuando la imagen termina de descargarse
    lambda: |-
      it.image(0, 0, id(sb_view_image));

binary_sensor:
  # Botón Verde (KEY0 / GPIO3): Forzar refresco inmediato de la vista o imagen actual
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true # también despierta del deep sleep
    id: btn_refresh
    name: "Sincronizar (KEY0)"
    on_press:
      then:
        - light.turn_on:
            id: buzzer_tone
            brightness: 40%
        - delay: 60ms
        - light.turn_off:
            id: buzzer_tone
        - script.execute: fetch_view

  # Botón Físico Izquierdo (Visto de frente: GPIO5 / KEY2)
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: btn_prev
    name: "Botón Izquierdo"
    on_press:
      then:
        - delay: 60ms # Ventana de tiempo para detectar combo si se aprietan ambos
        - lambda: |-
            if (id(combo_active)) {
              return;
            }
            if (id(btn_next).state) {
              id(toggle_display_mode).execute();
              return;
            }
            if (id(display_mode) == 0) {
              id(view_index) = (id(view_index) - 1 + 5) % 5;
            } else {
              id(gallery_index) -= 1;
            }
        - if:
            condition:
              lambda: 'return !id(combo_active);'
            then:
              - light.turn_on:
                  id: buzzer_tone
                  brightness: 30%
              - delay: 40ms
              - light.turn_off:
                  id: buzzer_tone
              - script.execute: fetch_view
    on_release:
      then:
        - lambda: |-
            if (!id(btn_prev).state && !id(btn_next).state) {
              id(combo_active) = false;
            }

  # Botón Físico Derecho (Visto de frente: GPIO4 / KEY1)
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: btn_next
    name: "Botón Derecho"
    on_press:
      then:
        - delay: 60ms # Ventana de tiempo para detectar combo
        - lambda: |-
            if (id(combo_active)) {
              return;
            }
            if (id(btn_prev).state) {
              id(toggle_display_mode).execute();
              return;
            }
            if (id(display_mode) == 0) {
              id(view_index) = (id(view_index) + 1) % 5;
            } else {
              id(gallery_index) += 1;
            }
        - if:
            condition:
              lambda: 'return !id(combo_active);'
            then:
              - light.turn_on:
                  id: buzzer_tone
                  brightness: 30%
              - delay: 40ms
              - light.turn_off:
                  id: buzzer_tone
              - script.execute: fetch_view
    on_release:
      then:
        - lambda: |-
            if (!id(btn_prev).state && !id(btn_next).state) {
              id(combo_active) = false;
            }
