esphome:
  name: reterminal-second-brain
  friendly_name: "Second Brain E1002"
  on_boot:
    priority: 600
    then:
      - output.turn_on: bsp_battery_enable
      - delay: 200ms
      - component.update: battery_voltage

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Habilitar 8MB PSRAM Octal para buffers gráficos
psram:
  mode: octal

logger:
  hardware_uart: UART0
  level: INFO

api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "reTerminal-SecondBrain-AP"
    password: "ChangeMe123"
  on_connect:
    then:
      - delay: 1s
      - logger.log: "Wi-Fi conectado, solicitando imagen inicial con telemetría..."
      - script.execute: fetch_view

captive_portal:

# Cliente HTTP para descargar vistas desde la Raspberry Pi
http_request:
  id: http_client
  timeout: 10s

# Bus SPI de la pantalla ePaper
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

# Bus I2C para sensor SHT40
i2c:
  scl: GPIO20
  sda: GPIO19

globals:
  - id: view_index
    type: int
    restore_value: true
    initial_value: '0'

sensor:
  - platform: sht4x
    temperature:
      name: "Temperatura Ambiente"
      id: room_temp
    humidity:
      name: "Humedad Ambiente"
      id: room_hum

  - platform: adc
    pin: GPIO1
    name: "Voltaje Batería"
    id: battery_voltage
    update_interval: 60s
    attenuation: 12db
    filters:
      - multiply: 2.0

output:
  - platform: gpio
    pin: GPIO6
    id: bsp_led
    inverted: true

  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

  - platform: ledc
    pin: GPIO45
    id: buzzer_pwm

light:
  - platform: binary
    name: "LED Frontal"
    output: bsp_led
    id: status_led

  - platform: monochromatic
    name: "Zumbador"
    output: buzzer_pwm
    id: buzzer_tone

# Descarga de imagen dinámica desde el backend de la Raspberry Pi
image:
  - platform: online_image
    id: sb_view_image
    url: "http://192.168.4.36:8088/render?view=resumen"
    format: PNG
    type: RGB565
    buffer_size: 65536
    update_interval: never # Se actualiza mediante el script fetch_view
    on_download_finished:
      then:
        - light.turn_on:
            id: status_led
        - delay: 200ms
        - light.turn_off:
            id: status_led
        - component.update: epaper_display
    on_error:
      then:
        - logger.log: "Error descargando imagen desde el backend"

script:
  - id: fetch_view
    then:
      - lambda: |-
          const char* views[] = {"resumen", "alta", "media", "baja", "clientes"};
          std::string url = std::string("http://192.168.4.36:8088/render?view=") + views[id(view_index)];
          if (!isnan(id(battery_voltage).state)) {
            url += "&vbat=" + esphome::to_string(id(battery_voltage).state);
          }
          if (!isnan(id(room_temp).state)) {
            url += "&temp=" + esphome::to_string(id(room_temp).state);
          }
          if (!isnan(id(room_hum).state)) {
            url += "&hum=" + esphome::to_string(id(room_hum).state);
          }
          ESP_LOGI("second_brain", "Solicitando vista: %s", url.c_str());
          id(sb_view_image).set_url(url);
          id(sb_view_image).update();

# Sincronización horaria SNTP (Zona horaria Chile)
time:
  - platform: sntp
    id: sntp_time
    timezone: "America/Santiago"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time:
      # 1) A las 08:45 de Lunes a Viernes (inicio de jornada)
      - seconds: 0
        minutes: 45
        hours: 8
        days_of_week: MON-FRI
        then:
          - logger.log: "Refresco programado (08:45 Lun-Vie)"
          - script.execute: fetch_view
      # 2) Cada 15 minutos entre 09:00 y 18:45 de Lunes a Viernes
      - seconds: 0
        minutes: /15
        hours: 9-18
        days_of_week: MON-FRI
        then:
          - logger.log: "Refresco programado (09:00-18:45 Lun-Vie cada 15 min)"
          - script.execute: fetch_view
      # 3) A las 19:00 de Lunes a Viernes (último refresco del horario laboral)
      - seconds: 0
        minutes: 0
        hours: 19
        days_of_week: MON-FRI
        then:
          - logger.log: "Refresco programado de cierre (19:00 Lun-Vie)"
          - script.execute: fetch_view

# Pantalla E Ink Spectra 6 (800x480)
display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never # Solo se refresca cuando la imagen termina de descargarse
    lambda: |-
      it.image(0, 0, id(sb_view_image));

binary_sensor:
  # Botón Verde (KEY0 / GPIO3): Forzar refresco inmediato
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    id: btn_refresh
    name: "Sincronizar (KEY0)"
    on_press:
      then:
        - light.turn_on:
            id: buzzer_tone
            brightness: 40%
        - delay: 60ms
        - light.turn_off:
            id: buzzer_tone
        - script.execute: fetch_view

  # Botón Físico Izquierdo (Visto de frente: GPIO5 / KEY2): Vista Anterior
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: btn_prev
    name: "Vista Anterior (Botón Izquierdo)"
    on_press:
      then:
        - light.turn_on:
            id: buzzer_tone
            brightness: 30%
        - delay: 40ms
        - light.turn_off:
            id: buzzer_tone
        - lambda: |-
            id(view_index) = (id(view_index) - 1 + 5) % 5;
        - script.execute: fetch_view

  # Botón Físico Derecho (Visto de frente: GPIO4 / KEY1): Vista Siguiente
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    id: btn_next
    name: "Vista Siguiente (Botón Derecho)"
    on_press:
      then:
        - light.turn_on:
            id: buzzer_tone
            brightness: 30%
        - delay: 40ms
        - light.turn_off:
            id: buzzer_tone
        - lambda: |-
            id(view_index) = (id(view_index) + 1) % 5;
        - script.execute: fetch_view
